name: Build VST3

# Windows is built on every push to main and for every version tag.
# macOS only when started by hand ("Run workflow", tick "Also build for macOS"):
# macOS runners are scarce and count ten times against the Actions minutes of a
# private repository.
#
# A tag such as v1.0 also publishes a GitHub release with the Windows plugin and
# the user guide. Its text is the section "## Neu in 1.0" of README.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build for macOS"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write   # for the release on version tags

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos && '[{"name":"Windows","os":"windows-latest","zip":"holterdipolter-Filter-Windows-VST3.zip"},{"name":"macOS","os":"macos-latest","zip":"holterdipolter-Filter-macOS-VST3.zip"}]' || '[{"name":"Windows","os":"windows-latest","zip":"holterdipolter-Filter-Windows-VST3.zip"}]') }}

    steps:
      - uses: actions/checkout@v7

      # JUCE is fetched by CMake (pinned in CMakeLists.txt), so there is nothing else to install.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # One plugin for both Apple Silicon and Intel Macs.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Zipped here rather than by the upload step: a macOS bundle loses its
      # file permissions and code signature layout when the action zips it.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "build/HolterdipolterFilter_artefacts/Release/VST3/holterdipolter Filter.vst3" -DestinationPath "${{ matrix.zip }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "build/HolterdipolterFilter_artefacts/Release/VST3/holterdipolter Filter.vst3" "${{ matrix.zip }}"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.zip }}
          archive: false
          if-no-files-found: error

      - name: Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $readme  = Get-Content README.md -Raw -Encoding UTF8
          $pattern = '(?ms)^## Neu in ' + [regex]::Escape($version) + '\s*\r?\n(.*?)(?=^## )'
          $news    = if ($readme -match $pattern) { $Matches[1].Trim() } else { "" }

          $notes = @"
          ## Installieren

          1. ``holterdipolter-Filter-Windows-VST3.zip`` herunterladen und entpacken.
          2. Den Ordner ``holterdipolter Filter.vst3`` als Ganzes nach ``C:\Program Files\Common Files\VST3\`` kopieren und eine ältere Fassung ersetzen.
          3. In der DAW die Plugins neu einlesen.

          Bedienung: siehe Userguide (PDF unten).

          ## Neu in $version

          $news
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

          $guide = Get-ChildItem docs -Filter *.pdf | Sort-Object Name | Select-Object -Last 1
          gh release create $env:TAG "${{ matrix.zip }}" $guide.FullName `
            --title "holterdipolter Filter $version" --notes-file release-notes.md
